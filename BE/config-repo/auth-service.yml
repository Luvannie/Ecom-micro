server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:-auth-db}:5432/${AUTH_DB_NAME:-auth_service}
    username: ${AUTH_DB_USER:-auth_user}
    password: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:-redis}
      port: ${REDIS_PORT:-6379}
      password: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  actuator:
    health:
      db: true

security:
  jwt:
    issuer: ecom-auth-service
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    secret: ${JWT_SECRET:?JWT_SECRET environment variable is required}