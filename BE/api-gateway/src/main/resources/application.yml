server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    issuer: ecom-auth-service
    secret: ${JWT_SECRET:}
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/auth/refresh
    - /actuator/health
    - /v3/api-docs
    - /swagger-ui
